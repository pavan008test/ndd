[privacy_mode]
outward = false                     ;outward camera privacy
inward = true                       ;inward camera privacy
left = false                        ;left camera privacy
right = false                       ;right camera privacy
audio = true                        ;driveri audio privacy(if it is true audio recording will be disabled)
ext_cam = false                     ;all external cameras privacy
ext_cam_audio = true                ;external camera audio privacy
save_user_alert_video = false       ;if this is true, driver initiated alert will upload irrespective of privacy(applicable only to inward)
gps = false                         ;gps tracking will be disabled if it is true
off_duty_mode = false               ;personal privacy feature
inward_led_color = red              ;decides inward led color(can be red, green or purple)
