[sdcard]
mount=false                                  ; SdCard will not be used; loop mount in emmc is used
storageTier = 1                              ; This value defines the levels of storage duration. Allowed values 1 and 2
sizeForCircularBuffer = 95                   ; %of SDcard allocated for circular buffer
runFsckOnMountFail = true                    ; if true, CB will send fsck msg to diag for nd_sdcard.img correction when image is failed to mount.
runFsckOnResizeFail = true                   ; if true, CB will send fsck msg to diag when resize2fs failes to shrink image file for consicutive 13 times.
deleteUnknownFile = false                    ; true: delete file if its file type in add_file_db is not known, false: Don't delete
root_ro_correct=false                        ; true: It wil trigger the slot recovery script in case of root partition read-only
use_extended_attr=true                      ; true: use extended attributes to store metadata and read, false: don't use xattrs
payload_dump_interval = 0                   ; value is describing for how long to dump the payload in hours

[drp]
; 0 - disabled, 1 - enabled
