[aws_iot_publish]
enabled=false
publish_freq_in_secs=10  ; Value in secs

[log]
log_freq_bloating = 500
enable_non_critical = false
non_critical_log_retain_period = 30
enable_age_based_deletion = false
service_based_critical_log_filter = false

[vm]
enabled=true
dirty_writeback_centisecs=100          ; Post this time linux shall start writeback flush on dirty cache. 100 centisecond = 1 sec
dirty_expire_centisecs=100             ; Post this time linux starts fore flush on dirty cache.

[gps]
gps_fail_counter = 5                    ; in minutes, post this gps recover command is run

[uploader_settings]
conn_timeout_alert=90
max_timeout_alert=120
vod_timeout_hrs = 72

[upload_settings]
observation_frequency = 10 ; This value needs to be an integer and can be anything between 1 & 10

[live_streaming]
enabled=false
enc_type=2
fps=10
width=640
height=360
bitrate=512000
iframeinterval = 10
outward_stream_start_file=/home/ubuntu/autocam/audio/nd_debug2/live_streaming_outward_start.wav
outward_stream_end_file=/home/ubuntu/autocam/audio/nd_debug2/live_streaming_outward_end.wav
