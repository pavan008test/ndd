cpu_gpu_info_secs = 5 ;frequency of cpu gpu free info sampling
videohealthstats_secs = 600 ;frequency of uploading data to the cloud
healthstats_secs = 60 ;frequency of healthstats sampling
db_version = 2 ;DB version is 2
